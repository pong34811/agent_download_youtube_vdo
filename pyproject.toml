[project]
name = "youtube-downloader"
version = "0.1.0"
description = "YouTube video downloader - MP4 1080p, batch up to 10 URLs"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp",
]

[project.scripts]
download = "youtube_downloader.cli:main"

[tool.setuptools]
packages = ["youtube_downloader"]
